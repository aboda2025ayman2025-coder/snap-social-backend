<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Social Downloader</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; font-size: 22px; color: #0088cc; }
        .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; text-align: center; outline: none; }
        button { padding: 12px 18px; border-radius: 8px; border: none; background: #0088cc; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #0077b5; }
        #downloader-frame { width: 100%; height: 450px; border: none; border-radius: 12px; background: #1e1e1e; display: none; margin-top: 15px; }
        .placeholder-text { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Snap Social Downloader</h2>
        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا...">
            <button onclick="loadDownloader()">تحميل</button>
        </div>

        <p id="infoText" class="placeholder-text">أدخل الرابط واضغط تحميل لجلب سيرفرات الفيديو مباشرة.</p>

        <!-- محرك التحميل الوسيط المباشر -->
        <iframe id="downloader-frame" src=""></iframe>
    </div>

    <script>
        function loadDownloader() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const frame = document.getElementById('downloader-frame');
            const infoText = document.getElementById('infoText');

            if (!urlInput) {
                alert("يرجى إدخال رابط الفيديو أولاً!");
                return;
            }

            // تجهيز المحرك الوسيط المباشر
            const cleanUrl = encodeURIComponent(urlInput);
            frame.src = `https://loader.to/api/card/?url=${cleanUrl}`;
            
            // إظهار مربع التحميل
            frame.style.display = "block";
            infoText.style.display = "none";
        }
    </script>
</body>
</html>
