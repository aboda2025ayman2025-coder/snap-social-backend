<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Social Downloader</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { max-width: 450px; margin: 40px auto; background: #1e1e1e; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; margin-bottom: 15px; text-align: center; outline: none; }
        button { width: 95%; padding: 14px; border-radius: 10px; border: none; background: #0088cc; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0077b5; }
        #status { margin-top: 18px; font-size: 15px; font-weight: 500; }
        .dl-container { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .download-btn { display: block; width: 90%; padding: 12px; background: #28a745; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .download-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 Snap Social Downloader</h2>
        <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا...">
        <button onclick="downloadVideo()">جلب سيرفرات التحميل</button>
        
        <div id="status"></div>
        <div id="result" class="dl-container"></div>
    </div>

    <script>
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function downloadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            status.innerHTML = "⏳ جاري استخراج رابط التحميل...";
            status.style.color = "#0088cc";
            result.innerHTML = "";

            if (!urlInput) {
                status.innerHTML = "⚠️ يرجى إدخال رابط صحيح!";
                status.style.color = "#ff4d4d";
                return;
            }

            const videoId = extractVideoID(urlInput);
            if (!videoId) {
                status.innerHTML = "⚠️ تعذر التعرف على رابط الفيديو، تأكد منه جودته.";
                status.style.color = "#ff4d4d";
                return;
            }

            // قائمة سيرفرات Invidious المباشرة لتجنب الحظر والتحويلات الخارجية
            const instances = [
                "https://inv.nadeko.net",
                "https://invidious.nerdvpn.de",
                "https://vid.puppethead.com"
            ];

            let success = false;

            for (let instance of instances) {
                try {
                    const res = await fetch(`${instance}/api/v1/videos/${videoId}`);
                    if (res.ok) {
                        const data = await res.json();
                        const format = data.formatStreams.reverse().find(f => f.container === 'mp4') || data.formatStreams[0];
                        
                        if (format && format.url) {
                            status.innerHTML = "✅ تم جلب الفيديو بنجاح!";
                            status.style.color = "#28a745";
                            
                            result.innerHTML = `
                                <a href="${format.url}" target="_blank" download class="download-btn">
                                    📥 تحميل الفيديو (${format.qualityLabel || 'MP4'})
                                </a>
                            `;
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    continue;
                }
            }

            if (!success) {
                status.innerHTML = "❌ تعذر جلب الفيديو حالياً، جرب رابطاً آخر.";
                status.style.color = "#ff4d4d";
            }
        }
    </script>
</body>
</html>
