<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Social Downloader</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { max-width: 450px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
        button { width: 95%; padding: 12px; border-radius: 8px; border: none; background: #0088cc; color: #fff; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Snap Social Downloader</h2>
        <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا...">
        <button onclick="downloadVideo()">جلب سيرفرات التحميل</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            status.innerHTML = "جاري الاتصال بالسيرفر...";
            result.innerHTML = "";

            if (!urlInput) {
                status.innerHTML = "<span style='color:red;'>يرجى وضع رابط!</span>";
                return;
            }

            try {
                // الاتصال بـ Cobalt مباشرة من جهازك
                const response = await fetch("https://co.wuk.sh/api/json", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: urlInput, vQuality: "720" })
                });

                const data = await response.json();

                if (data.url) {
                    status.innerHTML = "<span style='color:green;'>تم تجهيز الفيديو بنجاح!</span>";
                    result.innerHTML = `<a href="${data.url}" target="_blank" class="download-btn">تحميل الفيديو (MP4) 📥</a>`;
                } else {
                    throw new Error("سيرفر احتياطي");
                }
            } catch (err) {
                // سيرفر احتياطي سريع مباشرة في حالة تعثر الأول
                status.innerHTML = "جاري التحويل لسيرفر الاحتياط المباشر...";
                window.open(`https://cobalt.tools/#${encodeURIComponent(urlInput)}`, '_blank');
                status.innerHTML = "<span style='color:green;'>تم توجيهك لصفحة التحميل المباشرة!</span>";
            }
        }
    </script>
</body>
</html>
